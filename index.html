<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #1d3a33;
    --wood: #4a2c1a;
    --wood-light: #6e4429;
    --brass: #c29b45;
    --paper: #efe6d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--wall);
    color: var(--paper);
    font-family: "Fraunces", Georgia, serif;
    padding: 32px 16px 56px;
  }
  h1 { text-align: center; font-size: 2rem; margin: 0 0 4px; }
  .sub { text-align: center; margin: 0 0 28px; opacity: .7; }

  .case {
    max-width: 960px;
    margin: 0 auto;
    background: #2a1a10;
    border: 14px solid var(--wood);
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.6);
  }
  .shelf {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 230px;
    padding: 0 20px;
    overflow-x: auto;
    border-bottom: 16px solid var(--wood-light);
    box-shadow: 0 6px 0 var(--wood);
  }
  .shelf:last-child { border-bottom-width: 18px; }

  .book {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    font-family: "Caveat", "Segoe Script", cursive;
    font-size: 1.35rem;
    color: var(--paper);
    padding: 12px 0;
    border-radius: 3px 3px 0 0;
    box-shadow: inset 3px 0 5px rgba(255,255,255,.12), inset -4px 0 6px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .15s ease;
    white-space: nowrap;
    overflow: hidden;
  }
  .book:hover, .book:focus-visible { transform: translateY(-12px); outline: none; }
  .book:focus-visible { box-shadow: 0 0 0 2px var(--brass); }
  .book::before, .book::after {
    content: "";
    position: absolute;
  }
  .band {
    width: 100%;
    height: 3px;
    background: var(--brass);
    opacity: .75;
  }
  .spine { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .actions { text-align: center; margin-bottom: 24px; }
  .add {
    font: inherit;
    background: var(--brass);
    color: #2a1a10;
    border: 0;
    border-radius: 4px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .add:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
  .reader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    background: rgba(10, 20, 17, .97);
  }
  .reader[hidden] { display: none; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
  .bar strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar a { color: var(--paper); }
  .danger {
    font: inherit;
    background: none;
    color: #eeaaaa;
    border: 1px solid #eeaaaa;
    border-radius: 4px;
    padding: 9px 16px;
    cursor: pointer;
  }
  #readerFrame { flex: 1; border: 0; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .book { transition: none; } }
</style>
</head>
<body>
  <h1>My Library</h1>
  <p class="sub">Every book you read lives here.</p>
  <div class="actions">
    <button id="addBtn" class="add">Add a book</button>
    <input type="file" id="picker" accept=".pdf,application/pdf" multiple hidden>
  </div>
  <div class="case" id="case"></div>

  <div class="reader" id="reader" hidden>
    <div class="bar">
      <strong id="readerTitle"></strong>
      <a id="readerTab" target="_blank" rel="noopener">Open in new tab</a>
      <button id="removeBtn" class="danger">Remove book</button>
      <button id="closeBtn" class="add">Close</button>
    </div>
    <iframe id="readerFrame" title="Book"></iframe>
  </div>

<script>
  const colors = ["#7a2e2e", "#2f4b6e", "#3d5a3a", "#5b3a6b", "#8a5a2b", "#244c4c", "#6b2f45", "#43434f"];
  const perShelf = 8;

  let seed = 0;
  function makeBook(title, file = null) {
    const n = seed++;
    return {
      title,
      file, // the PDF she picked (null for the fake books)
      color: colors[n % colors.length],
      height: 150 + (n * 37) % 60,
      width: 44 + (n * 13) % 22
    };
  }
  let books = []; // books she added, saved in IndexedDB

  // --- Saving books in the browser (IndexedDB) ---
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("library", 1);
      req.onupgradeneeded = () =>
        req.result.createObjectStore("books", { keyPath: "id", autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveBook(book) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("books", "readwrite");
      const req = tx.objectStore("books").add(book);
      tx.oncomplete = () => resolve(req.result); // the new book's id
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadBooks() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction("books").objectStore("books").getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteBook(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("books", "readwrite");
      tx.objectStore("books").delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  const caseEl = document.getElementById("case");
  function render() {
    caseEl.replaceChildren();
    const shelfCount = Math.max(3, Math.ceil(books.length / perShelf));
    for (let s = 0; s < shelfCount; s++) {
      const shelf = document.createElement("div");
      shelf.className = "shelf";
      books.slice(s * perShelf, (s + 1) * perShelf).forEach(b => {
        const el = document.createElement("div");
        el.className = "book";
        el.tabIndex = 0;
        el.title = b.title;
        el.style.background = b.color;
        el.style.height = b.height + "px";
        el.style.width = b.width + "px";
        el.textContent = b.title;
        el.setAttribute("role", "button");
        el.addEventListener("click", () => openBook(b));
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBook(b); }
        });
        shelf.appendChild(el);
      });
      caseEl.appendChild(shelf);
    }
  }
  // Reader: open a book to read it, or remove it
  const reader = document.getElementById("reader");
  const frame = document.getElementById("readerFrame");
  let current = null, currentUrl = null;
  function openBook(book) {
    if (!book.file) return;
    current = book;
    currentUrl = URL.createObjectURL(book.file);
    document.getElementById("readerTitle").textContent = book.title;
    document.getElementById("readerTab").href = currentUrl;
    frame.src = currentUrl;
    reader.hidden = false;
    document.getElementById("closeBtn").focus();
  }
  function closeReader() {
    reader.hidden = true;
    frame.src = "about:blank";
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    current = null;
    currentUrl = null;
  }
  document.getElementById("closeBtn").addEventListener("click", closeReader);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !reader.hidden) closeReader();
  });
  document.getElementById("removeBtn").addEventListener("click", async () => {
    if (!current || !confirm("Remove “" + current.title + "” from your library?")) return;
    const gone = current;
    closeReader();
    books = books.filter(b => b !== gone);
    try {
      if (gone.id != null) await deleteBook(gone.id);
    } catch (err) {
      console.error(err);
      alert("The book left the shelf, but couldn’t be removed from the browser’s storage.");
    }
    render();
  });

  // Add a book: pick one or more PDFs, each becomes a spine and is saved
  const picker = document.getElementById("picker");
  document.getElementById("addBtn").addEventListener("click", () => picker.click());
  picker.addEventListener("change", async () => {
    const files = [...picker.files];
    picker.value = "";
    for (const file of files) {
      const book = makeBook(file.name.replace(/\.pdf$/i, ""), file);
      book.added = Date.now();
      books.unshift(book);
      try {
        book.id = await saveBook(book);
      } catch (err) {
        console.error(err);
        alert("This book is on the shelf, but couldn't be saved in the browser.");
      }
    }
    render();
  });

  // On page load: bring back the saved books
  (async () => {
    try {
      books = await loadBooks();
      books.sort((a, b) => b.added - a.added);
      seed = books.length;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (err) {
      console.error(err);
    }
    render();
  })();
</script>
</body>
</html>
