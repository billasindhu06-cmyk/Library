<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #1d3a33;
    --wood: #4a2c1a;
    --wood-light: #6e4429;
    --brass: #c29b45;
    --paper: #efe6d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--wall);
    color: var(--paper);
    font-family: "Fraunces", Georgia, serif;
    padding: 32px 16px 56px;
  }
  h1 { text-align: center; font-size: 2rem; margin: 0 0 4px; }
  .sub { text-align: center; margin: 0 0 28px; opacity: .7; }

  .case {
    max-width: 960px;
    margin: 0 auto;
    background: #2a1a10;
    border: 14px solid var(--wood);
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.6);
  }
  .shelf {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 230px;
    padding: 0 20px;
    overflow-x: auto;
    border-bottom: 16px solid var(--wood-light);
    box-shadow: 0 6px 0 var(--wood);
  }
  .shelf:last-child { border-bottom-width: 18px; }

  .book {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    font-family: "Caveat", "Segoe Script", cursive;
    font-size: 1.35rem;
    color: var(--paper);
    padding: 12px 0;
    border-radius: 3px 3px 0 0;
    box-shadow: inset 3px 0 5px rgba(255,255,255,.12), inset -4px 0 6px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .15s ease;
    white-space: nowrap;
    overflow: hidden;
  }
  .book:hover, .book:focus-visible { transform: translateY(-12px); outline: none; }
  .book:focus-visible { box-shadow: 0 0 0 2px var(--brass); }
  .book::before, .book::after {
    content: "";
    position: absolute;
  }
  .band {
    width: 100%;
    height: 3px;
    background: var(--brass);
    opacity: .75;
  }
  .spine { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  @media (prefers-reduced-motion: reduce) { .book { transition: none; } }
</style>
</head>
<body>
  <h1>My Library</h1>
  <p class="sub">Every book you read lives here.</p>
  <div class="case" id="case"></div>

<script>
  // Fake books for now. In a later stage these come from PDFs she adds.
  const titles = [
    "Pride and Prejudice", "Moby Dick", "Jane Eyre", "Dracula",
    "Frankenstein", "Little Women", "Emma", "Great Expectations",
    "Wuthering Heights", "The Odyssey", "Hamlet", "Middlemarch",
    "Persuasion", "Walden", "Siddhartha", "The Hobbit",
    "Anne of Green Gables", "Dubliners", "Beloved", "Rebecca",
    "Kim", "Candide", "Ulysses", "Heidi"
  ];
  const colors = ["#7a2e2e", "#2f4b6e", "#3d5a3a", "#5b3a6b", "#8a5a2b", "#244c4c", "#6b2f45", "#43434f"];
  const perShelf = 8;

  const caseEl = document.getElementById("case");
  for (let i = 0; i < titles.length; i += perShelf) {
    const shelf = document.createElement("div");
    shelf.className = "shelf";
    titles.slice(i, i + perShelf).forEach((title, j) => {
      const n = i + j;
      const book = document.createElement("div");
      book.className = "book";
      book.tabIndex = 0;
      book.title = title;
      book.style.background = colors[n % colors.length];
      book.style.height = (150 + (n * 37) % 60) + "px";
      book.style.width = (44 + (n * 13) % 22) + "px";
      book.textContent = title;
      shelf.appendChild(book);
    });
    caseEl.appendChild(shelf);
  }
</script>
</body>
</html>
