<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #1d3a33;
    --wood: #4a2c1a;
    --wood-light: #6e4429;
    --brass: #c29b45;
    --paper: #efe6d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--wall);
    color: var(--paper);
    font-family: "Fraunces", Georgia, serif;
    padding: 32px 16px 56px;
  }
  h1 { text-align: center; font-size: 2rem; margin: 0 0 4px; }
  .sub { text-align: center; margin: 0 0 28px; opacity: .7; }

  .case {
    max-width: 960px;
    margin: 0 auto;
    background: #2a1a10;
    border: 14px solid var(--wood);
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.6);
  }
  .shelf {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 230px;
    padding: 0 20px;
    overflow-x: auto;
    border-bottom: 16px solid var(--wood-light);
    box-shadow: 0 6px 0 var(--wood);
  }
  .shelf:last-child { border-bottom-width: 18px; }

  .book {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    font-family: "Caveat", "Segoe Script", cursive;
    font-size: 1.35rem;
    color: var(--paper);
    padding: 12px 0;
    border-radius: 3px 3px 0 0;
    box-shadow: inset 3px 0 5px rgba(255,255,255,.12), inset -4px 0 6px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .15s ease;
    white-space: nowrap;
    overflow: hidden;
  }
  .book:hover, .book:focus-visible { transform: translateY(-12px); outline: none; }
  .book:focus-visible { box-shadow: 0 0 0 2px var(--brass); }
  .book::before, .book::after {
    content: "";
    position: absolute;
  }
  .band {
    width: 100%;
    height: 3px;
    background: var(--brass);
    opacity: .75;
  }
  .spine { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .actions { text-align: center; margin-bottom: 24px; }
  .add {
    font: inherit;
    background: var(--brass);
    color: #2a1a10;
    border: 0;
    border-radius: 4px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .add:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .book { transition: none; } }
</style>
</head>
<body>
  <h1>My Library</h1>
  <p class="sub">Every book you read lives here.</p>
  <div class="actions">
    <button id="addBtn" class="add">Add a book</button>
    <input type="file" id="picker" accept=".pdf,application/pdf" multiple hidden>
  </div>
  <div class="case" id="case"></div>

<script>
  // Fake books for now. In a later stage these come from PDFs she adds.
  const titles = [
    "Pride and Prejudice", "Moby Dick", "Jane Eyre", "Dracula",
    "Frankenstein", "Little Women", "Emma", "Great Expectations",
    "Wuthering Heights", "The Odyssey", "Hamlet", "Middlemarch",
    "Persuasion", "Walden", "Siddhartha", "The Hobbit",
    "Anne of Green Gables", "Dubliners", "Beloved", "Rebecca",
    "Kim", "Candide", "Ulysses", "Heidi"
  ];
  const colors = ["#7a2e2e", "#2f4b6e", "#3d5a3a", "#5b3a6b", "#8a5a2b", "#244c4c", "#6b2f45", "#43434f"];
  const perShelf = 8;

  let seed = 0;
  function makeBook(title, file = null) {
    const n = seed++;
    return {
      title,
      file, // the PDF she picked (null for the fake books)
      color: colors[n % colors.length],
      height: 150 + (n * 37) % 60,
      width: 44 + (n * 13) % 22
    };
  }
  const samples = titles.map(t => makeBook(t)); // shown only while her shelf is empty
  let books = [];                                // books she added, saved in IndexedDB

  // --- Saving books in the browser (IndexedDB) ---
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("library", 1);
      req.onupgradeneeded = () =>
        req.result.createObjectStore("books", { keyPath: "id", autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveBook(book) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("books", "readwrite");
      const req = tx.objectStore("books").add(book);
      tx.oncomplete = () => resolve(req.result); // the new book's id
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadBooks() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction("books").objectStore("books").getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  const caseEl = document.getElementById("case");
  function render() {
    caseEl.replaceChildren();
    const list = books.length ? books : samples;
    for (let i = 0; i < list.length; i += perShelf) {
      const shelf = document.createElement("div");
      shelf.className = "shelf";
      list.slice(i, i + perShelf).forEach(b => {
        const el = document.createElement("div");
        el.className = "book";
        el.tabIndex = 0;
        el.title = b.title;
        el.style.background = b.color;
        el.style.height = b.height + "px";
        el.style.width = b.width + "px";
        el.textContent = b.title;
        shelf.appendChild(el);
      });
      caseEl.appendChild(shelf);
    }
  }
  // Add a book: pick one or more PDFs, each becomes a spine and is saved
  const picker = document.getElementById("picker");
  document.getElementById("addBtn").addEventListener("click", () => picker.click());
  picker.addEventListener("change", async () => {
    const files = [...picker.files];
    picker.value = "";
    for (const file of files) {
      const book = makeBook(file.name.replace(/\.pdf$/i, ""), file);
      book.added = Date.now();
      books.unshift(book);
      try {
        book.id = await saveBook(book);
      } catch (err) {
        console.error(err);
        alert("This book is on the shelf, but couldn't be saved in the browser.");
      }
    }
    render();
  });

  // On page load: bring back the saved books
  (async () => {
    try {
      books = await loadBooks();
      books.sort((a, b) => b.added - a.added);
      seed = samples.length + books.length;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (err) {
      console.error(err);
    }
    render();
  })();
</script>
</body>
</html>
